title: GitPizza performance
summary: "One guest walk (home -> menu -> configure -> cart -> checkout -> pay -> tracking), 6 runs per step with run 0 as warm-up, against a fresh demo reset with the simulation running. auto_explain was on for the measurement only (restored afterwards). Every guest-facing step answers in well under a second of server time; 'place order and pay' is dominated by the simulated payment gateway's deliberate processing delay (SIM-01), not by app work."
items:
  "step:Guest orders a pizza / 8 place order and pay": {note: "includes the simulated gateway's processing time (lite-configuration: payment processing seconds) and the 2 s payment-sheet poll"}
  "step:Guest orders a pizza / 5 add to cart": {note: "~550 queries: the line and cart recalculation walk options, recipe and allergens per line (see candidates); bounded by 30 items per cart"}
  "step:Guest orders a pizza / 3 open configurator": {note: "~300 queries: DS_Config_Choices builds one tile per option; bounded by ~30 options per pizza"}
  "candidate:Shop.DS_Config_Choices": {status: accepted, note: "loops over the options of one pizza (~30): bounded"}
  "candidate:Shop.SUB_Line_Recalculate": {status: accepted, note: "loops over the chosen options and recipe of one line: bounded"}
  "candidate:Shop.SUB_Cart_Recalculate": {status: accepted, note: "loops over cart lines, max 30 items per cart (BR-CART-03)"}
  "candidate:Shop.SUB_Order_Place": {status: accepted, note: "snapshot of the cart lines once per order (max 30)"}
  "candidate:Shop.SUB_Product_Recalculate": {status: accepted, note: "runs at reset / catalog change only, not per request"}
  "candidate:Simulation.SIM_Kitchen": {status: accepted, note: "background: orders in the kitchen (a handful); settings read once since the earlier fix"}
  "candidate:Simulation.SIM_Couriers": {status: accepted, note: "background simulation over 5 couriers"}
  "candidate:Simulation.SUB_Oven_FirstFree": {status: accepted, note: "background simulation over 3 ovens"}
  "candidate:Simulation.SUB_Toast_Broadcast": {status: accepted, note: "runs once per demo reset"}
recommendations:
  - "Cache the per-option tiles of the configurator (or build them in one retrieve) to cut ~300 queries per open."
  - "Before real volume, give the simulation clock its own cadence instead of a 1.5 s self-requeueing task, or switch it off outside demos."
